<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 신혼집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --paper:#FFFFFF; --soft:#F5F7F2; --ink:#1C2733; --muted:#5B6773; --line:#D3DACF;
  --key:#E2A31F; --keyInk:#3A2A00; --groom:#2D6CAB; --bride:#B8406A; --ok:#2B7A4B; --bad:#B23A2C; --warn:#9A6A00;
  --shadow:0 1px 0 rgba(28,39,51,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151B21; --paper:#1D252D; --soft:#232C35; --ink:#E6ECEF; --muted:#9AA7B2; --line:#34404B;
    --key:#E9B43E; --keyInk:#2A1E00; --groom:#6FA6DE; --bride:#E27C9F; --ok:#5FBF86; --bad:#EE7B6D; --warn:#E0B354;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151B21; --paper:#1D252D; --soft:#232C35; --ink:#E6ECEF; --muted:#9AA7B2; --line:#34404B;
  --key:#E9B43E; --keyInk:#2A1E00; --groom:#6FA6DE; --bride:#E27C9F; --ok:#5FBF86; --bad:#EE7B6D; --warn:#E0B354;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--groom)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:.3em 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
:focus-visible{outline:3px solid var(--key);outline-offset:2px;border-radius:6px}

/* house header */
.house{background:var(--ink);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:18px;position:relative;overflow:hidden}
:root[data-theme="dark"] .house{background:#0E1318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .house{background:#0E1318}}
.house .roof{position:absolute;right:-10px;top:-30px;width:150px;height:150px;border:14px solid var(--key);border-bottom:none;border-right:none;transform:rotate(45deg);opacity:.9}
.couple{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:"Gowun Batang",serif;font-size:1.45rem;position:relative}
.couple .amp{color:var(--key);font-size:1.1rem}
.who{display:inline-flex;align-items:center;gap:8px}
.who img{width:30px;height:30px;border-radius:50%;border:2px solid currentColor}
.who.g{color:#9CC4EE}.who.b{color:#F2A9C2}
.who .nm{color:#fff}
.dday{margin-top:10px;font-size:.9rem;color:#C8D1D8;position:relative}
.dday b{color:var(--key);font-size:1.05rem}
.invite{margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;position:relative}
.code{font-family:"IBM Plex Sans KR",monospace;letter-spacing:.2em;font-size:1.4rem;font-weight:700;color:var(--key)}

/* sections */
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.reg{background:transparent;border-color:var(--bad);color:var(--bad)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.tag.g{border-color:var(--groom);color:var(--groom)}
.tag.b{border-color:var(--bride);color:var(--bride)}
.stripe-g{border-left:4px solid var(--groom)}
.stripe-b{border-left:4px solid var(--bride)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn.key{background:var(--key);border-color:var(--key);color:var(--keyInk)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:none;background:none;cursor:pointer;color:var(--muted);padding:6px;min-width:36px;min-height:36px;border-radius:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem}
.stat span{font-size:.8rem;color:var(--muted)}

/* ruler */
.ruler{position:relative;height:74px;margin:8px 4px 4px}
.ruler .track{position:absolute;left:0;right:0;top:30px;height:10px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.ruler .zone{position:absolute;top:30px;height:10px;border-radius:5px 0 0 5px}
.ruler .zone.z1{background:color-mix(in srgb,var(--ok) 55%,transparent)}
.ruler .zone.z2{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.ruler .tick{position:absolute;top:22px;width:2px;height:26px;background:var(--ink)}
.ruler .tick i{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-style:normal;font-size:.72rem;white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:0 5px;color:var(--ink)}
.ruler .axis{position:absolute;top:48px;font-size:.72rem;color:var(--muted);transform:translateX(-50%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* stars */
.stars{display:inline-flex;gap:1px}
.stars button{border:none;background:none;padding:2px;cursor:pointer;font-size:1.15rem;line-height:1;color:var(--line)}
.stars button.on{color:var(--key)}
.stars.ro span{font-size:.9rem;color:var(--line)}
.stars.ro span.on{color:var(--key)}

/* chips filter */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* forms */
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 11px;min-height:42px}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--paper);padding:7px 16px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.unit{position:relative}
.unit input{padding-right:44px}
.unit em{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.8rem;color:var(--muted);pointer-events:none}
.hint{font-size:.78rem;color:var(--muted);margin-top:2px}

/* verdict */
.verdict{border-radius:14px;padding:16px;border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--paper))}
.verdict.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--paper))}
.verdict .big{font-size:1.5rem;font-weight:700}
table.k{width:100%;border-collapse:collapse;font-size:.9rem}
table.k td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.k td:last-child{text-align:right;white-space:nowrap}
table.k tr.total td{border-bottom:none;font-weight:700;padding-top:9px}
.bind{font-size:.72rem;color:var(--warn);font-weight:600}

/* sparkline */
svg.spark{width:100%;height:56px;display:block}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:-18px;background:var(--paper);padding:6px 0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:none;background:none;padding:8px 2px 9px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke:var(--key)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:90%}
.empty{text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.policy h3{margin-bottom:4px}
.policy .impact{margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:.88rem}
.ai-out{white-space:pre-wrap;font-size:.92rem;line-height:1.7}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.onb h1{font-family:"Gowun Batang",serif;font-size:1.9rem;margin-bottom:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="center"><p class="muted">불러오는 중…</p></div></div>
<nav class="tabs" id="nav" hidden><div class="in" id="navin"></div></nav>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------- constants (calc defaults; the policy doc can override) ---------- */
const DEF = {
  ltv:{reg:40,regFirst:70,metro:70,metroFirst:70,local:70,localFirst:80},
  caps:[{upTo:150000,cap:60000},{upTo:250000,cap:40000},{upTo:null,cap:20000}],
  dsr:40, stress:{metro:3.0,local:0.75}, maxTermMetro:30,
  programs:{
    newborn:{incomeSingle:13000,incomeDual:20000,priceMax:90000,max:40000,ltv:70},
    didimNewly:{income:8500,priceMax:60000,max:32000,netAsset:51100,ltv:70},
    bogeum:{income:7000,priceMax:60000,max:36000,maxFirst:42000,ltv:70},
    butteokNewly:{income:7500,netAsset:34500,maxMetro:30000,maxLocal:20000,ratio:80},
    newbornJeonse:{incomeSingle:13000,incomeDual:20000,depositMetro:50000,max:24000,ratio:80},
    bankJeonse:{ratio:80,max:50000}
  },
  regulated:["서울 *","경기 과천시","경기 광명시","경기 성남시 분당구","경기 성남시 수정구","경기 성남시 중원구","경기 수원시 영통구","경기 수원시 장안구","경기 수원시 팔달구","경기 안양시 동안구","경기 용인시 수지구","경기 의왕시","경기 하남시","경기 화성시 동탄구","경기 용인시 기흥구","경기 구리시"]
};
const SEOUL = ["강남구","강동구","강북구","강서구","관악구","광진구","구로구","금천구","노원구","도봉구","동대문구","동작구","마포구","서대문구","서초구","성동구","성북구","송파구","양천구","영등포구","용산구","은평구","종로구","중구","중랑구"];
const GYEONGGI = ["과천시","광명시","성남시 분당구","성남시 수정구","성남시 중원구","수원시 영통구","수원시 장안구","수원시 팔달구","수원시 권선구","안양시 동안구","안양시 만안구","용인시 수지구","용인시 기흥구","용인시 처인구","의왕시","하남시","구리시","화성시 동탄구","화성시(동탄구 외)","고양시","김포시","남양주시","부천시","시흥시","안산시","오산시","평택시","의정부시","군포시","광주시","파주시","기타 경기"];
const STATUS = ["관심","연락중","협상중","가계약","계약완료","보류"];
const RATE_KEYS = [["traffic","교통"],["noise","소음·층간"],["light","채광·향"],["manage","단지 관리"],["life","생활 편의"]];

/* ---------- state ---------- */
const S = {db:null,user:null,sample:null,uid:null,hid:null,house:null,complexes:[],visits:[],cands:[],fin:null,policy:null,tab:"home",profiles:{},candFilter:"전체",unsubs:[],canWrite:true};
const $ = s => document.querySelector(s);
const app = $("#app");

/* ---------- utils ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function n(v){const x=Number(String(v==null?"":v).replace(/,/g,""));return isFinite(x)?x:0}
function won(m){ // 만원 -> "7억 2,000만"
  m=Math.round(n(m)); if(m===0) return "0원";
  const neg=m<0; m=Math.abs(m);
  const eok=Math.floor(m/10000), man=m%10000; let s="";
  if(eok) s+=eok.toLocaleString("ko-KR")+"억";
  if(man) s+=(s?" ":"")+man.toLocaleString("ko-KR")+"만";
  return (neg?"−":"")+s+(man?"원":"");
}
function wonS(m){ // short: 7.2억
  m=n(m); if(Math.abs(m)>=10000) return (m/10000).toFixed(m%10000===0?0:1)+"억"; return Math.round(m).toLocaleString("ko-KR")+"만";
}
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function toast(msg){const h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",2600)}
function rid(len){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=new Uint32Array(len);crypto.getRandomValues(r);for(const x of r)s+=a[x%a.length];return s}
function P(){ // merged params
  const p=S.policy&&S.policy.params||{};
  return {...DEF,...p,ltv:{...DEF.ltv,...(p.ltv||{})},stress:{...DEF.stress,...(p.stress||{})},programs:{...DEF.programs,...(p.programs||{})},regulated:(S.policy&&S.policy.regulated)||DEF.regulated};
}
function isMetro(r){return /^(서울|경기|인천)/.test(r||"")}
function isReg(r,override){
  if(override==="yes") return true; if(override==="no") return false;
  if(!r) return false;
  return P().regulated.some(e=>e.endsWith("*")?r.startsWith(e.slice(0,-1).trim()):r===e);
}
function roleOf(uid){const m=S.house&&S.house.members&&S.house.members[uid];return m?m.role:null}
function memberByRole(role){const ms=S.house&&S.house.members||{};const id=Object.keys(ms).find(k=>ms[k].role===role);return id?{id,...ms[id]}:null}
function displayName(uid){
  if(!uid) return "";
  const m=S.house&&S.house.members&&S.house.members[uid];
  if(m&&m.nick) return m.nick;
  const p=S.profiles[uid]; if(p&&p.name) return p.name;
  return m? (m.role==="groom"?"신랑":"신부") : "누군가";
}
function roleClass(uid){const r=roleOf(uid);return r==="groom"?"g":r==="bride"?"b":""}
async function refreshProfiles(){
  if(!S.user||!S.house) return;
  const ids=Object.keys(S.house.members||{});
  if(!ids.length) return;
  try{S.profiles=await S.user.profiles(ids)}catch(e){}
}
async function guard(fn,okMsg){
  try{await fn(); if(okMsg) toast(okMsg)}
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"){S.canWrite=false;toast("이 계정은 보기 권한만 있어 저장할 수 없어요")}
    else if(c==="quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 기록을 지워주세요");
    else if(c==="resource_exhausted") toast("요청이 많아요. 잠시 뒤 다시 저장해주세요");
    else toast("저장하지 못했어요. 네트워크를 확인하고 다시 시도해주세요");
    console.error(e);
  }
}

/* ---------- calculators ---------- */
function annualFactor(ratePct,years){const r=ratePct/100/12,k=years*12;if(r<=0)return 12/k;return 12*r/(1-Math.pow(1+r,-k))}
function monthlyPay(principal,ratePct,years){return principal*annualFactor(ratePct,years)/12}
function capFor(price){for(const c of P().caps){if(c.upTo==null||price<=c.upTo)return c.cap}return 0}
function acqTax(p,over85,relief){
  let r; const eok=p/10000;
  if(p<=60000) r=1; else if(p<=90000) r=Math.round((eok*2/3-3)*100)/100; else r=3;
  const tax=p*r/100, edu=tax*0.1, farm=over85?p*0.002:0;
  let total=tax+edu+farm; if(relief&&p<=120000) total=Math.max(0,total-200);
  return {total,rate:r};
}
function brokerBuy(p){if(p<5000)return Math.min(p*.006,25);if(p<20000)return Math.min(p*.005,80);if(p<90000)return p*.004;if(p<120000)return p*.005;if(p<150000)return p*.006;return p*.007}
function brokerRent(p){if(p<5000)return Math.min(p*.005,20);if(p<10000)return Math.min(p*.004,30);if(p<60000)return p*.003;if(p<120000)return p*.004;if(p<150000)return p*.005;return p*.006}
function finBase(f){
  f=f||{};
  const gi=n(f.gIncome),bi=n(f.bIncome),inc=gi+bi;
  const cash=n(f.gCash)+n(f.bCash)+n(f.parents)+n(f.otherAsset);
  const net=cash-n(f.debtBalance);
  return {inc,dual:gi>0&&bi>0,cash,net};
}
function calcBuy(price,region,f,override){
  f=f||{}; const p=P(); price=n(price);
  const reg=isReg(region,override), metro=isMetro(region)||reg;
  const {inc,dual,cash,net}=finBase(f);
  const first=!!f.firstHome, homeless=f.homeless!==false;
  const ltvPct = reg?(first?p.ltv.regFirst:p.ltv.reg):metro?(first?p.ltv.metroFirst:p.ltv.metro):(first?p.ltv.localFirst:p.ltv.local);
  const ltvAmt=price*ltvPct/100;
  const cap=metro?capFor(price):Infinity;
  const rate=n(f.rate)||4.2;
  const term=metro?Math.min(n(f.term)||30,p.maxTermMetro):(n(f.term)||30);
  const stress=(f.stress!==""&&f.stress!=null&&!isNaN(Number(f.stress)))?Number(f.stress):(metro?p.stress.metro:p.stress.local);
  const room=Math.max(0,inc*p.dsr/100-n(f.debtAnnual));
  const dsrAmt=room/annualFactor(rate+stress,term);
  let bank=Math.min(ltvAmt,cap,dsrAmt); let bind= bank===dsrAmt?"DSR":bank===cap?"주택가격별 한도":"LTV";
  if(!homeless&&metro){bank=0;bind="보유주택"}
  const over85=f.over85===true;
  const progs=[];
  const pr=p.programs;
  { // 신생아 특례
    const q=pr.newborn, rs=[];
    if(!f.newborn) rs.push("2년 내 출산·입양 가구만");
    if(inc>(dual?q.incomeDual:q.incomeSingle)) rs.push("소득 기준 초과");
    if(price>q.priceMax) rs.push("주택가격 "+wonS(q.priceMax)+" 초과");
    if(over85) rs.push("전용 85㎡ 초과");
    if(!homeless) rs.push("무주택 요건");
    progs.push({name:"신생아 특례 디딤돌",ok:!rs.length,rs,amt:Math.min(q.max,price*q.ltv/100,cap)});
  }
  { const q=pr.didimNewly, rs=[];
    if(inc>q.income) rs.push("부부합산 소득 "+wonS(q.income)+" 초과");
    if(price>q.priceMax) rs.push("주택가격 "+wonS(q.priceMax)+" 초과");
    if(net>q.netAsset) rs.push("순자산 기준 초과");
    if(over85) rs.push("전용 85㎡ 초과");
    if(!homeless) rs.push("무주택 요건");
    progs.push({name:"신혼 디딤돌",ok:!rs.length,rs,amt:Math.min(q.max,price*q.ltv/100,cap)});
  }
  { const q=pr.bogeum, rs=[];
    if(inc>q.income) rs.push("소득 "+wonS(q.income)+" 초과");
    if(price>q.priceMax) rs.push("주택가격 "+wonS(q.priceMax)+" 초과");
    progs.push({name:"보금자리론",ok:!rs.length,rs,amt:Math.min(first?q.maxFirst:q.max,price*Math.min(q.ltv,ltvPct)/100,cap)});
  }
  let best=bank,bestName="은행 주담대";
  for(const g of progs){if(g.ok&&g.amt>best){best=g.amt;bestName=g.name}}
  const tax=acqTax(price,over85,!!f.acqRelief);
  const broker=brokerBuy(price);
  const misc=price*0.002+n(f.moving==null||f.moving===""?300:f.moving);
  const costs=tax.total+broker+misc;
  const need=price-best+costs;
  return {price,reg,metro,ltvPct,ltvAmt,cap,dsrAmt,bank,bind,rate,term,stress,progs,best,bestName,tax,broker,misc,costs,need,cash,gap:cash-need,monthly:monthlyPay(best,rate,term),inc};
}
function calcRent(dep,region,f,override){
  f=f||{}; const p=P().programs; dep=n(dep);
  const reg=isReg(region,override), metro=isMetro(region)||reg;
  const {inc,dual,cash,net}=finBase(f);
  const progs=[];
  { const q=p.butteokNewly, rs=[];
    if(inc>q.income) rs.push("부부합산 소득 "+wonS(q.income)+" 초과");
    if(net>q.netAsset) rs.push("순자산 기준 초과");
    progs.push({name:"신혼부부 버팀목",ok:!rs.length,rs,amt:Math.min(metro?q.maxMetro:q.maxLocal,dep*q.ratio/100)});
  }
  { const q=p.newbornJeonse, rs=[];
    if(!f.newborn) rs.push("2년 내 출산·입양 가구만");
    if(inc>(dual?q.incomeDual:q.incomeSingle)) rs.push("소득 기준 초과");
    if(metro&&dep>q.depositMetro) rs.push("보증금 "+wonS(q.depositMetro)+" 초과");
    progs.push({name:"신생아 특례 버팀목",ok:!rs.length,rs,amt:Math.min(q.max,dep*q.ratio/100)});
  }
  const bank=Math.min(dep*p.bankJeonse.ratio/100,p.bankJeonse.max);
  let best=bank,bestName="은행 전세대출";
  for(const g of progs){if(g.ok&&g.amt>best){best=g.amt;bestName=g.name}}
  const broker=brokerRent(dep), misc=n(f.moving==null||f.moving===""?300:f.moving);
  const costs=broker+misc, need=dep-best+costs;
  const rate=n(f.rate)||4.2;
  return {dep,reg,metro,progs,bank,best,bestName,broker,misc,costs,need,cash,gap:cash-need,monthly:best*rate/100/12};
}
function maxAfford(region,f,override){
  let ok=0;
  for(let p=5000;p<=400000;p+=500){ if(calcBuy(p,region,f,override).gap>=0) ok=p; }
  return ok;
}

/* ---------- boot ---------- */
async function boot(){
  if(!window.claude||!window.claude.use){return fatal("claude.ai에서 열어야 기록이 저장돼요.")}
  const [db,user,sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")]);
  S.db=db;S.user=user;S.sample=sample;
  if(!db) return fatal("저장소에 연결하지 못했어요. claude.ai에서 이 페이지를 다시 열어주세요.");
  S.uid=user?await user.id():null;
  if(!S.uid) return fatal("로그인한 계정으로 열어야 두 사람의 기록을 나눌 수 있어요.");
  try{const c=await user.can("data.write"); if(c===false) S.canWrite=false}catch(e){}
  db.doc("policy/current").onSnapshot(s=>{S.policy=s.exists?s.data():null;render()},()=>{});
  db.doc("data/users/"+S.uid+"/link").onSnapshot(async s=>{
    const hid=s.exists?s.data().hid:null;
    if(hid!==S.hid){S.hid=hid;attachHouse()}
    if(!hid) renderOnboard();
  },e=>fatal("기록을 불러오지 못했어요. 새로고침해주세요."));
}
function fatal(msg){app.innerHTML='<div class="center"><h2>우리 신혼집</h2><p class="muted">'+esc(msg)+'</p></div>';$("#nav").hidden=true}

function attachHouse(){
  S.unsubs.forEach(u=>{try{u()}catch(e){}}); S.unsubs=[];
  S.house=null;S.complexes=[];S.visits=[];S.cands=[];S.fin=null;
  if(!S.hid) return;
  const base="households/"+S.hid;
  S.unsubs.push(S.db.doc(base).onSnapshot(async s=>{S.house=s.exists?s.data():null;await refreshProfiles();render()},()=>{}));
  S.unsubs.push(S.db.collection(base+"/complexes").orderBy("createdAt","desc").onSnapshot(s=>{S.complexes=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  S.unsubs.push(S.db.collection(base+"/visits").orderBy("date","desc").onSnapshot(s=>{S.visits=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  S.unsubs.push(S.db.collection(base+"/candidates").orderBy("createdAt","desc").onSnapshot(s=>{S.cands=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
  S.unsubs.push(S.db.doc(base+"/finance/main").onSnapshot(s=>{if(!finDirty){S.fin=s.exists?s.data():{};render()}},()=>{}));
}

function spark(prices){
  const pts=(prices||[]).filter(x=>n(x.price)>0&&x.date).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2) return "";
  const vs=pts.map(x=>n(x.price)), mn=Math.min(...vs), mx=Math.max(...vs), span=mx-mn||1;
  const W=300,H=56,pad=6;
  const xy=pts.map((x,i)=>[pad+i*(W-2*pad)/(pts.length-1),H-pad-(n(x.price)-mn)/span*(H-2*pad)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="var(--groom)" stroke-width="2" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(",")).join(" ")}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--groom)"/>`).join("")}</svg>`;
}

  <p class="small muted" style="margin-top:-4px">실거래가·호가·KB시세를 직접 기록해두면 흐름이 그래프로 쌓여요. 단지를 누르면 시세 사이트로 바로 갈 수 있어요.</p>
  ${S.complexes.length?S.complexes.map(c=>{
    const lp=latestPrice(c), reg=isReg(c.region,c.regOverride), vc=S.visits.filter(v=>v.complexId===c.id).length;
    return `<button class="card" data-cx="${esc(c.id)}" style="width:100%;text-align:left;cursor:pointer;display:block">
      <div class="row between"><div class="grow"><h3>${esc(c.name)}</h3><div class="row" style="gap:6px;margin-top:3px"><span class="tag">${esc(c.region||"지역 미지정")}</span>${reg?'<span class="tag reg">규제지역</span>':""}${vc?`<span class="tag">임장 ${vc}회</span>`:""}</div></div>
      <div style="text-align:right">${lp?`<b class="num">${won(lp.price)}</b><div class="small muted">${esc(lp.type||"")} · ${esc(lp.date)}</div>`:'<span class="small muted">시세 기록 없음</span>'}</div></div>
      ${spark(c.prices)}

bind.price=()=>{
  $("#addCx").onclick=()=>editComplex();
  app.querySelectorAll("[data-cx]").forEach(b=>b.onclick=()=>complexSheet(b.dataset.cx));
};
function regionSelect(id,val){
  const opt=(v)=>`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(v.replace(/^(서울|경기) /,""))}${isReg(v)?" · 규제":""}</option>`;
  return `<select id="${id}"><option value="">선택</option>
    <optgroup label="서울">${SEOUL.map(s=>opt("서울 "+s)).join("")}</optgroup>
    <optgroup label="경기">${GYEONGGI.map(s=>opt("경기 "+s)).join("")}</optgroup>
    <optgroup label="그 외">${opt("인천")}${opt("지방")}</optgroup></select>`;
}
function editComplex(id){
  const c=id?complexById(id):{};
  openSheet(id?"단지 수정":"단지 추가",`
    <label class="f"><span>단지 이름</span><input type="text" id="cxName" maxlength="40" value="${esc(c.name||"")}" placeholder="예: 동천 래미안 이스트팰리스"></label>
    <label class="f"><span>지역</span>${regionSelect("cxRegion",c.region||"")}</label>
    <label class="f"><span>규제지역 여부</span><select id="cxOv"><option value="">자동 판단</option><option value="yes" ${c.regOverride==="yes"?"selected":""}>규제지역으로 계산</option><option value="no" ${c.regOverride==="no"?"selected":""}>비규제로 계산</option></select><div class="hint">지정이 바뀌었는데 목록이 아직 안 바뀌었을 때만 직접 고르세요.</div></label>
    <div class="grid2"><label class="f"><span>관심 평형</span><input type="text" id="cxArea" maxlength="20" value="${esc(c.area||"")}" placeholder="예: 84㎡"></label>
    <label class="f"><span>세대수·연식</span><input type="text" id="cxMeta" maxlength="30" value="${esc(c.meta||"")}" placeholder="예: 1,200세대 · 2010년"></label></div>
    <label class="f"><span>출퇴근 메모</span><input type="text" id="cxCommute" maxlength="80" value="${esc(c.commute||"")}" placeholder="예: 신랑 분당 25분 / 신부 수원 40분"></label>
    <label class="f"><span>메모</span><textarea id="cxMemo" maxlength="600">${esc(c.memo||"")}</textarea></label>`,
  async()=>{
    const d={name:$("#cxName").value.trim(),region:$("#cxRegion").value,regOverride:$("#cxOv").value,area:$("#cxArea").value.trim(),meta:$("#cxMeta").value.trim(),commute:$("#cxCommute").value.trim(),memo:$("#cxMemo").value.trim()};
    if(!d.name){toast("단지 이름을 입력해주세요");return false}
    const col="households/"+S.hid+"/complexes";
    if(id) await S.db.doc(col+"/"+id).update(d);
    else await S.db.collection(col).add({...d,prices:[],createdBy:S.uid,createdAt:Date.now()});
  },id?"단지를 수정했어요":"단지를 추가했어요",
  id?{label:"단지 삭제",fn:async()=>{if(!confirm("이 단지와 시세 기록을 지울까요? 연결된 임장·후보 기록은 남아요."))return false;await S.db.doc("households/"+S.hid+"/complexes/"+id).delete()},msg:"단지를 삭제했어요"}:null);
}
function complexSheet(id){
  const c=complexById(id); if(!c) return;
  const q=encodeURIComponent(c.name);
  const ps=(c.prices||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  openSheet(c.name,`
    <div class="row" style="gap:6px;margin-bottom:8px"><span class="tag">${esc(c.region||"")}</span>${isReg(c.region,c.regOverride)?'<span class="tag reg">규제지역</span>':""}${c.area?`<span class="tag">${esc(c.area)}</span>`:""}${c.meta?`<span class="tag">${esc(c.meta)}</span>`:""}</div>
    ${c.commute?`<p class="small">출퇴근 · ${esc(c.commute)}</p>`:""}
    ${c.memo?`<p class="small muted" style="white-space:pre-wrap">${esc(c.memo)}</p>`:""}
    <div class="row" style="margin:10px 0;gap:6px">
      <a class="btn sm" target="_blank" rel="noopener" href="https://m.land.naver.com/search/result/${q}">네이버 부동산</a>
      <a class="btn sm" target="_blank" rel="noopener" href="https://hogangnono.com/search?q=${q}">호갱노노</a>
      <a class="btn sm" target="_blank" rel="noopener" href="https://rt.molit.go.kr/">국토부 실거래가</a>
      <a class="btn sm" target="_blank" rel="noopener" href="https://kbland.kr/">KB부동산</a>
    </div>
    ${spark(c.prices)}
    <h3 style="margin:14px 0 6px">시세 기록 추가</h3>
    <div class="grid2">
      <label class="f"><span>날짜</span><input type="date" id="pDate" value="${today()}"></label>
      <label class="f"><span>구분</span><select id="pType"><option>실거래</option><option>호가</option><option>KB시세</option><option>전세 실거래</option><option>전세 호가</option></select></label>
      <label class="f"><span>가격</span><div class="unit"><input type="number" inputmode="numeric" id="pPrice" placeholder="85000"><em>만원</em></div></label>
      <label class="f"><span>층·평형</span><input type="text" id="pFloor" maxlength="20" placeholder="12층 84㎡"></label>
    </div>
    <button class="btn key sm" id="pAdd">기록 추가</button>
    <h3 style="margin:16px 0 6px">기록 ${ps.length}건</h3>
    ${ps.length?`<table class="k">${ps.map((p,i)=>`<tr><td>${esc(p.date)} <span class="tag">${esc(p.type)}</span><div class="small muted">${esc(p.floor||"")}${p.by?" · "+esc(displayName(p.by)):""}</div></td><td><b class="num">${won(p.price)}</b><br><button class="iconbtn small" data-pdel="${i}" aria-label="이 기록 삭제">삭제</button></td></tr>`).join("")}</table>`:'<p class="small muted">아직 기록이 없어요.</p>'}
  `,null,null,{label:"단지 정보 수정",fn:async()=>{closeSheet();editComplex(id);return false}},()=>{
    $("#pAdd").onclick=()=>{
      const pr=n($("#pPrice").value); if(!pr){toast("가격을 만원 단위로 입력해주세요");return}
      const np=[...(c.prices||[]),{date:$("#pDate").value||today(),type:$("#pType").value,price:pr,floor:$("#pFloor").value.trim(),by:S.uid}].slice(-120);
      guard(async()=>{await S.db.doc("households/"+S.hid+"/complexes/"+id).update({prices:np});closeSheet();complexSheetLater(id)},"시세를 기록했어요");
    };
    document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{
      const target=ps[+b.dataset.pdel]; const np=(c.prices||[]).filter(x=>x!==target);
      guard(async()=>{await S.db.doc("households/"+S.hid+"/complexes/"+id).update({prices:np});closeSheet();complexSheetLater(id)},"기록을 지웠어요");
    });
  });
}
function complexSheetLater(id){setTimeout(()=>complexSheet(id),350)}

/* ----- visits ----- */
function starsRO(v){v=n(v);return `<span class="stars ro" aria-label="${v}점">${[1,2,3,4,5].map(i=>`<span class="${i<=v?"on":""}">★</span>`).join("")}</span>`}
function avgScore(v){const r=v.ratings||{};const xs=RATE_KEYS.map(k=>n(r[k[0]])).filter(x=>x>0);return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0}
function visitCard(v){
  const cx=complexById(v.complexId), rc=roleClass(v.by);
  return `<button class="card ${rc?"stripe-"+rc:""}" data-visit="${esc(v.id)}" style="width:100%;text-align:left;cursor:pointer;display:block">
    <div class="row between"><h3>${esc(cx?cx.name:(v.complexName||"삭제된 단지"))}</h3><span class="small muted num">${esc(v.date||"")}</span></div>
    <div class="row" style="gap:8px;margin-top:2px"><span class="tag ${rc}">${esc(displayName(v.by))} 기록</span>${avgScore(v)?starsRO(Math.round(avgScore(v)))+`<span class="small muted num">${avgScore(v).toFixed(1)}</span>`:""}</div>
    ${v.pros?`<p class="small" style="margin-top:6px">좋았던 점 · ${esc(v.pros)}</p>`:""}
    ${v.cons?`<p class="small">아쉬운 점 · ${esc(v.cons)}</p>`:""}
  </button>`;
}
function vVisit(){
  return `<div class="sec" style="margin-top:4px"><h2>임장 기록</h2><button class="btn key sm" id="addVisit">임장 기록하기</button></div>
  <p class="small muted" style="margin-top:-4px">기록한 사람 색으로 구분돼요. <span style="color:var(--groom);font-weight:600">파랑</span>은 신랑, <span style="color:var(--bride);font-weight:600">분홍</span>은 신부예요.</p>
  ${S.visits.length?S.visits.map(visitCard).join(""):`<div class="empty"><p>다녀온 단지의 교통, 소음, 채광을 별점으로 남겨두면<br>후보를 고를 때 둘의 기억을 맞춰볼 수 있어요.</p></div>`}`;
}
bind.visit=()=>{
  $("#addVisit").onclick=()=>editVisit();
  app.querySelectorAll("[data-visit]").forEach(b=>b.onclick=()=>editVisit(b.dataset.visit));
};
function starsInput(key,val){return `<span class="stars" data-stars="${key}" data-val="${n(val)}">${[1,2,3,4,5].map(i=>`<button type="button" data-s="${i}" class="${i<=n(val)?"on":""}" aria-label="${i}점">★</button>`).join("")}</span>`}
function wireStars(root){
  root.querySelectorAll("[data-stars]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const v=+b.dataset.s, cur=+g.dataset.val; const nv=cur===v?0:v; g.dataset.val=nv;
    g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.s<=nv));
  }));
}
function editVisit(id){
  if(!S.complexes.length){toast("시세 탭에서 단지를 먼저 추가해주세요");S.tab="price";render();return}
  const v=id?S.visits.find(x=>x.id===id):{date:today(),ratings:{}};
  const mine=!id||v.by===S.uid;
  openSheet(id?"임장 기록":"임장 기록하기",`
    ${id&&!mine?`<p class="small"><span class="tag ${roleClass(v.by)}">${esc(displayName(v.by))}</span> 님이 남긴 기록이에요. 같이 고칠 수 있어요.</p>`:""}
    <label class="f"><span>단지</span><select id="vCx">${S.complexes.map(c=>`<option value="${esc(c.id)}" ${c.id===v.complexId?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
    <label class="f"><span>다녀온 날</span><input type="date" id="vDate" value="${esc(v.date||today())}"></label>
    <div class="card" style="background:var(--soft)">
      ${RATE_KEYS.map(k=>`<div class="row between" style="margin:2px 0"><span>${k[1]}</span>${starsInput(k[0],(v.ratings||{})[k[0]])}</div>`).join("")}
    </div>
    <div class="grid2">
      <label class="f"><span>신랑 출근 시간</span><div class="unit"><input type="number" inputmode="numeric" id="vCg" value="${esc(v.commuteG||"")}"><em>분</em></div></label>
      <label class="f"><span>신부 출근 시간</span><div class="unit"><input type="number" inputmode="numeric" id="vCb" value="${esc(v.commuteB||"")}"><em>분</em></div></label>
    </div>
    <label class="f"><span>좋았던 점</span><input type="text" id="vPros" maxlength="120" value="${esc(v.pros||"")}"></label>
    <label class="f"><span>아쉬운 점</span><input type="text" id="vCons" maxlength="120" value="${esc(v.cons||"")}"></label>
    <label class="f"><span>메모 (중개사, 동·호, 관리비 등)</span><textarea id="vMemo" maxlength="1000">${esc(v.memo||"")}</textarea></label>`,
  async()=>{
    const ratings={}; document.querySelectorAll(".sheet [data-stars]").forEach(g=>ratings[g.dataset.stars]=+g.dataset.val);
    const cx=complexById($("#vCx").value);
    const d={complexId:$("#vCx").value,complexName:cx?cx.name:"",date:$("#vDate").value||today(),ratings,commuteG:n($("#vCg").value)||"",commuteB:n($("#vCb").value)||"",pros:$("#vPros").value.trim(),cons:$("#vCons").value.trim(),memo:$("#vMemo").value.trim()};
    const col="households/"+S.hid+"/visits";
    if(id) await S.db.doc(col+"/"+id).update(d); else await S.db.collection(col).add({...d,by:S.uid,createdAt:Date.now()});
  },"임장 기록을 저장했어요",
  id?{label:"기록 삭제",fn:async()=>{if(!confirm("이 임장 기록을 지울까요?"))return false;await S.db.doc("households/"+S.hid+"/visits/"+id).delete()},msg:"기록을 지웠어요"}:null,
  null,()=>wireStars(document.querySelector(".sheet")));
}

/* ----- candidates ----- */
function candVerdict(c){
  const cx=complexById(c.complexId), f=S.fin||{};
  if(!n(c.price)||!(finBase(f).cash>0)) return "";
  const r=c.dealType==="전세"?calcRent(c.price,cx&&cx.region,f,cx&&cx.regOverride):calcBuy(c.price,cx&&cx.region,f,cx&&cx.regOverride);
  return r.gap>=0?`<span class="tag ok">자금 가능 · 여유 ${wonS(r.gap)}</span>`:`<span class="tag bad">${wonS(-r.gap)} 부족</span>`;
}
function vCand(){
  const list=S.cands.filter(c=>S.candFilter==="전체"||c.status===S.candFilter);
  const g=memberByRole("groom"), b=memberByRole("bride");
  return `<div class="sec" style="margin-top:4px"><h2>계약 후보</h2><button class="btn key sm" id="addCand">후보 추가</button></div>
  <div class="chips" role="group" aria-label="상태 필터">${["전체",...STATUS].map(s=>`<button class="chip" data-f="${s}" aria-pressed="${S.candFilter===s}">${s}</button>`).join("")}</div>
  ${list.length?list.map(c=>{
    const cx=complexById(c.complexId), sc=c.scores||{};
    const sg=g?n(sc[g.id]):0, sb=b?n(sc[b.id]):0;
    return `<div class="card">
      <div class="row between"><div class="grow"><h3>${esc(cx?cx.name:"삭제된 단지")} <span class="small muted">${esc(c.unit||"")}</span></h3>
        <div class="row" style="gap:6px;margin-top:3px"><span class="tag">${esc(c.dealType||"매매")}</span>${c.area?`<span class="tag">${esc(c.area)}</span>`:""}${candVerdict(c)}</div></div>
        <div style="text-align:right"><b class="num" style="font-size:1.1rem">${n(c.price)?won(c.price):"-"}</b></div></div>
      <div class="row between" style="margin-top:8px">
        <div class="small"><span style="color:var(--groom);font-weight:600">신랑</span> ${g?(g.id===S.uid?starsInput("me",sg).replace('data-stars="me"','data-cscore="'+esc(c.id)+'"'):starsRO(sg)):starsRO(0)}</div>
        <div class="small"><span style="color:var(--bride);font-weight:600">신부</span> ${b?(b.id===S.uid?starsInput("me",sb).replace('data-stars="me"','data-cscore="'+esc(c.id)+'"'):starsRO(sb)):starsRO(0)}</div>
      </div>
      ${c.memo?`<p class="small muted" style="margin-top:6px;white-space:pre-wrap">${esc(c.memo)}</p>`:""}
      <div class="row between" style="margin-top:8px">
        <select data-cstatus="${esc(c.id)}" aria-label="진행 상태" style="width:auto;min-height:34px;padding:4px 8px">${STATUS.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select>
        <button class="btn sm ghost" data-cedit="${esc(c.id)}">수정</button>
      </div>
    </div>`}).join(""):`<div class="empty"><p>${S.cands.length?"이 상태의 후보가 없어요.":"마음에 드는 매물을 후보로 올리면 자금 가능 여부가 자동으로 붙어요."}</p></div>`}
  ${S.sample&&S.cands.length>=2?`<div class="card" style="margin-top:16px"><h3>후보 비교 정리</h3><p class="small muted">후보·임장 기록·자금 계산을 Claude에게 보내 장단점을 정리받아요. 호출할 때마다 보는 사람의 Claude 사용량이 쓰여요.</p><button class="btn" id="aiCmp">비교 정리 받기</button></div>`:""}`;
}
bind.cand=()=>{
  $("#addCand").onclick=()=>editCand();
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.candFilter=b.dataset.f;render()});
  app.querySelectorAll("[data-cedit]").forEach(b=>b.onclick=()=>editCand(b.dataset.cedit));
  app.querySelectorAll("[data-cstatus]").forEach(s=>s.onchange=()=>guard(()=>S.db.doc("households/"+S.hid+"/candidates/"+s.dataset.cstatus).update({status:s.value}),"상태를 바꿨어요"));
  app.querySelectorAll("[data-cscore]").forEach(g=>g.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
    const cur=+g.dataset.val, v=+btn.dataset.s, nv=cur===v?0:v;
    guard(()=>S.db.doc("households/"+S.hid+"/candidates/"+g.dataset.cscore).update({scores:{[S.uid]:nv}}));
  }));
  const ai=$("#aiCmp"); if(ai) ai.onclick=aiCompare;
};
function editCand(id){
  if(!S.complexes.length){toast("시세 탭에서 단지를 먼저 추가해주세요");S.tab="price";render();return}
  const c=id?S.cands.find(x=>x.id===id):{dealType:"매매",status:"관심"};
  openSheet(id?"후보 수정":"후보 추가",`
    <label class="f"><span>단지</span><select id="cCx">${S.complexes.map(x=>`<option value="${esc(x.id)}" ${x.id===c.complexId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
    <div class="grid2">
      <label class="f"><span>거래</span><select id="cType"><option ${c.dealType==="매매"?"selected":""}>매매</option><option ${c.dealType==="전세"?"selected":""}>전세</option></select></label>
      <label class="f"><span>상태</span><select id="cStatus">${STATUS.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></label>

      <label class="f"><span>면적</span><input type="text" id="cArea" maxlength="20" value="${esc(c.area||"")}" placeholder="84㎡"></label>
    </div>
    <label class="f"><span>가격 (매매가 또는 보증금)</span><div class="unit"><input type="number" inputmode="numeric" id="cPrice" value="${esc(c.price||"")}" placeholder="85000"><em>만원</em></div></label>
    <label class="f"><span>메모 (중개사 연락처, 입주 가능일, 옵션 등)</span><textarea id="cMemo" maxlength="1000">${esc(c.memo||"")}</textarea></label>`,
  async()=>{
    const d={complexId:$("#cCx").value,dealType:$("#cType").value,status:$("#cStatus").value,unit:$("#cUnit").value.trim(),area:$("#cArea").value.trim(),price:n($("#cPrice").value),memo:$("#cMemo").value.trim()};

  openSheet("후보 비교 정리",`<div class="ai-out" id="aiOut">생각하는 중…</div><div class="row" style="margin-top:12px"><button class="btn sm" id="aiStop">멈추기</button></div>`,null,null,null,()=>{
    aiCtl=new AbortController();

    S.sample(prompt,{signal:aiCtl.signal,cache:false,onText:({text})=>{const o=$("#aiOut");if(o)o.textContent=text}})
      .then(({text,truncated})=>{const o=$("#aiOut");if(o){o.textContent=text+(truncated?"\n\n(답이 길어 중간에 끊겼어요)":"")}const s=$("#aiStop");if(s)s.remove()})

  });

}
bind.policy=()=>{};

/* ---------- sheet ---------- */
function openSheet(title,body,onSave,okMsg,extra,after){
  closeSheet();
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="iconbtn" id="shClose" aria-label="닫기">닫기</button></div>${body}
  <div class="row between" style="margin-top:14px">${extra?`<button class="btn ghost ${/삭제/.test(extra.label)?"danger":""}" id="shExtra">${esc(extra.label)}</button>`:"<span></span>"}${onSave?`<button class="btn key" id="shSave">저장</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{if(e.target===ov)closeSheet()});
  $("#shClose").onclick=closeSheet;
  document.addEventListener("keydown",escClose);
  if(onSave) $("#shSave").onclick=async()=>{
    if(!S.canWrite){toast("보기 권한만 있어 저장할 수 없어요");return}
    const btn=$("#shSave"); btn.disabled=true;
    let r; try{r=await onSave()}catch(e){btn.disabled=false;return guard(()=>Promise.reject(e))}
    if(r===false){btn.disabled=false;return}
    closeSheet(); if(okMsg) toast(okMsg);
  };
  if(extra) $("#shExtra").onclick=async()=>{
    let r; try{r=await extra.fn()}catch(e){return guard(()=>Promise.reject(e))}
    if(r===false) return; closeSheet(); if(extra.msg) toast(extra.msg);
  };
  const first=ov.querySelector("input,select,textarea"); if(first&&!matchMedia("(pointer:coarse)").matches) first.focus();
  if(after) after();
}
function escClose(e){if(e.key==="Escape")closeSheet()}
function closeSheet(){const o=document.querySelector(".overlay");if(o)o.remove();document.removeEventListener("keydown",escClose);if(aiCtl){try{aiCtl.abort()}catch(e){}aiCtl=null}}

boot();
})();
</script>
</body>
</html>
